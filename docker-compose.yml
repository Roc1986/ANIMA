version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: anima_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anima}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anima_secret}
      POSTGRES_DB: ${POSTGRES_DB:-anima_hr}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anima}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anima_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-anima}:${POSTGRES_PASSWORD:-anima_secret}@db:5432/${POSTGRES_DB:-anima_hr}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey_change_in_production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      COMPANY_NAME: ${COMPANY_NAME:-Mi Empresa SpA}
      COMPANY_RUT: ${COMPANY_RUT:-76.000.000-0}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anima_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}

volumes:
  postgres_data:
  uploads_data:
